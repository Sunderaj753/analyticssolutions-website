<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
    <!-- Define gradients -->
    <defs>
        <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Outer circle -->
    <circle cx="60" cy="75" r="35" fill="none" stroke="#1E88E5" stroke-width="5" opacity="0.6"/>

    <!-- Middle circle -->
    <circle cx="60" cy="75" r="26" fill="none" stroke="#1E88E5" stroke-width="5" opacity="0.8"/>

    <!-- Inner circle -->
    <circle cx="60" cy="75" r="17" fill="none" stroke="#1E88E5" stroke-width="4"/>

    <!-- Arrow pointing right - stylized -->
    <path d="M 35 85 Q 40 90 50 85 L 45 75 Q 50 80 55 75 L 50 65 Q 40 70 35 75" fill="#1E88E5" opacity="0.9"/>

    <!-- Text: Analytics -->
    <text x="130" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="bold" fill="#1E88E5">Analytics</text>

    <!-- Text: Solutions -->
    <text x="130" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="bold" fill="#43A047">Solutions</text>
</svg>
